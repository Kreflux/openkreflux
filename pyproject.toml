[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openkreflux"
version = "0.1.0"
description = "Production-grade open-source reasoning verifier and resilient multi-provider inference engine for Kreflux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Kreflux AI", email = "open-source@kreflux.ai" }
]
keywords = [
    "llm",
    "inference",
    "routing",
    "failover",
    "reasoning",
    "verification",
    "benchmark",
    "kreflux"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
openkreflux = "openkreflux.cli:main"

[project.urls]
Homepage = "https://github.com/Kreflux/openkreflux"
Documentation = "https://github.com/Kreflux/openkreflux#readme"
Repository = "https://github.com/Kreflux/openkreflux.git"
Issues = "https://github.com/Kreflux/openkreflux/issues"

[tool.hatch.build.targets.wheel]
packages = ["openkreflux"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
